<app-seccion-page>
  <!-- Encabezado -->
  <div class="flex items-center justify-between">
    <app-header-page anteTitulo="Categoria" [titulo]="titulo() | titlecase" postTitulo="Aquí podras ver todas las tareas de acuerdo a la categoria seleccionada." />
    <div
      class="px-4 py-2 rounded-xl text-sm text-(--color-primary-light) dark:text-(--color-primary-dark) bg-(--color-fondo-secondary-light) dark:bg-(--color-fondo-tertiary-dark)"
    >
      {{ tareaStore.tareasPorCategoria().length }} tareas
    </div>

  </div>
  <!-- Tareas -->
  <div class="flex flex-col gap-3">

    @for (tarea of tareaStore.tareasPorCategoria(); track tarea.id) {
      <app-item-tarea [dataTarea]="tarea" />
    }
  </div>
</app-seccion-page>
