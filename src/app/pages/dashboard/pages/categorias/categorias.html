<section class="w-full md:p-6">

  <!-- Header -->
  <div class="mb-8 flex items-end justify-between">

    <div>
      <p class="text-sm font-medium text-(--color-fondo-boton)">
        Organización
      </p>
      

      <h1 class="mt-1 text-2xl font-bold tracking-tight text-gray-900">
        Categorías
      </h1>

      <p class="mt-2 text-sm text-gray-500">
        Visualiza el estado de tus tareas organizadas por categoría.
      </p>
    </div>

    <!-- Nueva categoría -->
    <button
      type="button"
      (click)="mostrarModalNuevaCategoria()"
      class="flex cursor-pointer items-center gap-2 rounded-xl bg-(--color-fondo-boton) px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-(--color-fondo-boton)/30"
    >
      <i class="fa-solid fa-plus"></i>
      Nueva
    </button>

  </div>


  <!-- Grid de categorías -->
  <div class="grid grid-cols-1 gap-5 md:grid-cols-2 xl:grid-cols-3">
    
    @for (categoria of categoriaStore.categorias(); track categoria.id) {
        <app-item-categoria [categoria]="categoria" />
    }
    
  </div>

</section>
