<div class="flex flex-col gap-5 md:p-6">
  <div class="grid grid-cols-2 md:grid-cols-4 gap-5">

    @let cantidadPendientes = tareaStore.cantidadTareasPendientes();
    @let cantidadParaHoy = tareaStore.cantidadTareasParaHoy();
    @let cantidadCompletas = tareaStore.cantidadTareasCompletas();
    @let cantidadEnProgreso = tareaStore.cantidadTareasEnProgreso();

    <app-item-resumen icono="fa-solid fa-inbox" nombre="Pendientes" [cantidad]="cantidadPendientes" />
    <app-item-resumen icono="fa-solid fa-bars-progress" nombre="En Progreso" [cantidad]="cantidadEnProgreso" />
    <app-item-resumen icono="fa-solid fa-circle-check" nombre="Completadas" [cantidad]="cantidadCompletas" />
    <app-item-resumen icono="fa-solid fa-clock" nombre="Para hoy" [cantidad]="cantidadParaHoy" />
  </div>
  <div>
    <div class="border-b-2 border-(--color-border) flex h-8 gap-1 md:gap-3">
        @for (link of links; track link.id) {
            <app-link-inicio [datalink]="link" />
        }
    </div>
    <div>
        <router-outlet />
    </div>
  </div>
</div>
